# 4 gate tất định của ShopLite: lint · unit · e2e · bao-mat.
# Tên job là tên check bắt buộc của main: KHÔNG đổi tên.
# Mỗi job chỉ cài đặt rồi gọi scripts/ci/gate.mjs - cùng script chạy ở máy, nên xanh ở máy = xanh trên CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Quyền mặc định của token workflow: chỉ đọc. Không job nào cần quyền ghi.
permissions:
  contents: read

# Đẩy commit mới thì hủy lượt chạy cũ của cùng PR (hoặc cùng nhánh).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ci/gate.mjs lint
      - name: Lưu log gate khi đỏ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-lint
          path: gate-lint.*
          retention-days: 3

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ci/gate.mjs unit
      - name: Lưu log gate khi đỏ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-unit
          path: gate-unit.*
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium
      - run: node scripts/ci/gate.mjs e2e
      - name: Lưu log gate và kết quả Playwright khi đỏ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-e2e
          path: |
            gate-e2e.*
            test-results/
          retention-days: 3

  bao-mat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks quét cả lịch sử commit, không chỉ commit cuối
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cài gitleaks 8.30.1 (kiểm sha256 trước khi dùng)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${file}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          # Sai checksum thì dừng job ngay, không chạy file vừa tải.
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${file}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${file}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks/gitleaks" version
      - name: Gate bao-mat
        # Tiêu đề, mô tả PR do người mở PR đặt: chỉ đi qua env, không chèn ${{ }} vào lệnh.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/gate.mjs bao-mat
      - name: Lưu log gate khi đỏ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-bao-mat
          path: gate-bao-mat.*
          retention-days: 3
